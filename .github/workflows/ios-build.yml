name: iOS 原型免签名编译与测试

# 本仓库是主仓库 TY_Music 中 ios_player/ 的公开构建镜像。
# 仅验证原型工程的编译与原生测试，不使用开发者证书、不产出可安装 IPA。
# 模拟器包使用 Xcode 默认 ad-hoc 签名；不要加 CODE_SIGNING_ALLOWED=NO，
# 否则 iOS 26 模拟器会因 Info.plist 未绑定签名而报 Missing bundle ID。
on:
  workflow_dispatch:
    inputs:
      xcode_version:
        description: '可选：指定 Xcode 版本，例如 27.0（留空使用 runner 默认版本）'
        required: false
        default: ''
        type: string
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Simulator build + XCTest (ad-hoc signed)
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      PROJECT: TYMusicProbe.xcodeproj
      SCHEME: TYMusicProbe
      DERIVED_DATA: build/DerivedData
      XCODE_VERSION: ${{ inputs.xcode_version }}

    steps:
      - name: Checkout（不拉取 LFS）
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: 选择 Xcode 并打印环境
        run: |
          set -euo pipefail
          if [ -n "${XCODE_VERSION}" ]; then
            if ! printf '%s' "${XCODE_VERSION}" | grep -qE '^[0-9]+(\.[0-9]+){0,2}$'; then
              echo "::error::xcode_version 格式无效: ${XCODE_VERSION}"
              exit 1
            fi
            echo "使用 /Applications/Xcode_${XCODE_VERSION}.app"
            sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          fi
          sw_vers
          xcodebuild -version
          echo "--- 已安装 Xcode ---"
          ls -1 /Applications | grep -E '^Xcode' || true

      - name: 生成 Node 环境
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 校验工程引用与资源
        run: python3 scripts/verify-project.py

      - name: 运行桥接测试（Node）
        run: node --test Tests/native-client.test.mjs

      - name: 编译模拟器版本（ad-hoc 签名）
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -project "${PROJECT}" \
            -scheme "${SCHEME}" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "${DERIVED_DATA}" \
            build 2>&1 | tee build/build.log

      - name: 选择可用 iPhone 模拟器
        id: simulator
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess

          raw = subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "--json"], text=True
          )
          devices = json.loads(raw)["devices"]

          def runtime_key(runtime):
              match = re.search(r"iOS-(\d+)(?:-(\d+))?", runtime)
              if not match:
                  return (0, 0)
              return (int(match.group(1)), int(match.group(2) or 0))

          candidates = [
              (runtime_key(runtime), device["name"], device["udid"])
              for runtime, items in devices.items()
              if "iOS" in runtime
              for device in items
              if device.get("isAvailable") and device.get("name", "").startswith("iPhone")
          ]
          if not candidates:
              raise SystemExit("没有可用的 iPhone 模拟器")

          candidates.sort(reverse=True)
          _, name, udid = candidates[0]
          print(f"选择模拟器: {name} ({udid})")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"udid={udid}\n")
              output.write(f"name={name}\n")
          PY

      - name: 运行 XCTest（ad-hoc 签名）
        run: |
          set -euo pipefail
          rm -rf build/NativeTests.xcresult
          xcodebuild \
            -project "${PROJECT}" \
            -scheme "${SCHEME}" \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "${DERIVED_DATA}" \
            -resultBundlePath build/NativeTests.xcresult \
            test 2>&1 | tee build/test.log

      - name: 打包模拟器 .app
        if: always()
        run: |
          mkdir -p build/artifacts
          APP="${DERIVED_DATA}/Build/Products/Debug-iphonesimulator/${SCHEME}.app"
          if [ -d "${APP}" ]; then
            ditto -c -k --sequesterRsrc --keepParent "${APP}" build/artifacts/${SCHEME}-simulator.zip
            echo "已打包 ${APP}"
          else
            echo "::warning::未找到模拟器 .app，不生成压缩包"
          fi

      - name: 上传产物与测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-build
          path: |
            build/artifacts/*.zip
            build/*.log
            build/NativeTests.xcresult
          if-no-files-found: warn
          retention-days: 14
