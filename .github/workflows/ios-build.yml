name: iOS 未签名安装包（IPA）

# 本仓库是主仓库 TY_Music 中 ios_player/ 的公开构建镜像。
# 主产物：Release 设备版未签名 IPA，供用户自行使用第三方工具签名安装。
# CI 不接触开发者证书、私钥或描述文件，也不产出可直接安装的成品。
on:
  workflow_dispatch:
    inputs:
      xcode_version:
        description: '可选：指定 Xcode 版本，例如 27.0（留空使用 runner 默认版本）'
        required: false
        default: ''
        type: string
      run_simulator_tests:
        description: '可选：运行模拟器 XCTest（Xcode 26.6 + iOS 26.5 上可能因运行时问题失败）'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths-ignore:
      - 'Resources/SearchDataParts/**'
  pull_request:
    paths-ignore:
      - 'Resources/SearchDataParts/**'

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Unsigned device IPA + optional simulator tests
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      PROJECT: TYMusicProbe.xcodeproj
      SCHEME: TYMusicProbe
      DERIVED_DATA: build/DerivedData
      XCODE_VERSION: ${{ inputs.xcode_version }}

    steps:
      - name: Checkout（不拉取 LFS）
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: 选择 Xcode 并打印环境
        run: |
          set -euo pipefail
          if [ -n "${XCODE_VERSION}" ]; then
            if ! printf '%s' "${XCODE_VERSION}" | grep -qE '^[0-9]+(\.[0-9]+){0,2}$'; then
              echo "::error::xcode_version 格式无效: ${XCODE_VERSION}"
              exit 1
            fi
            echo "使用 /Applications/Xcode_${XCODE_VERSION}.app"
            sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          fi
          sw_vers
          xcodebuild -version
          echo "--- 已安装 Xcode ---"
          ls -1 /Applications | grep -E '^Xcode' || true

      - name: 生成 Node 环境
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 校验工程引用与资源
        run: python3 scripts/verify-project.py

      - name: 运行桥接测试（Node）
        run: node --test Tests/native-client.test.mjs

      - name: 编译 Release 设备版本（未签名）
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -project "${PROJECT}" \
            -scheme "${SCHEME}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "${DERIVED_DATA}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build/build-device.log

      - name: ad-hoc 预签名（便于 Sideloadly 等工具重签）
        run: |
          set -euo pipefail
          APP="${DERIVED_DATA}/Build/Products/Release-iphoneos/${SCHEME}.app"
          test -d "${APP}"
          /usr/bin/plutil -convert xml1 "${APP}/Info.plist"
          /usr/bin/codesign --force --sign - "${APP}"
          /usr/bin/codesign --verify --verbose=2 "${APP}"
          /usr/bin/codesign -d --verbose=4 "${APP}" > build/codesign.txt 2>&1 || true

      - name: 打包未签名 IPA
        run: |
          set -euo pipefail
          APP="${DERIVED_DATA}/Build/Products/Release-iphoneos/${SCHEME}.app"
          test -d "${APP}"

          rm -rf build/ipa build/artifacts
          mkdir -p build/ipa/Payload build/artifacts
          cp -R "${APP}" build/ipa/Payload/
          ditto -c -k --sequesterRsrc --keepParent build/ipa/Payload "build/artifacts/${SCHEME}-unsigned.ipa"

          python3 - "${APP}" <<'PY'
          import os, plistlib, sys

          app = sys.argv[1]
          with open(os.path.join(app, "Info.plist"), "rb") as stream:
              info = plistlib.load(stream)
          bundle_id = info.get("CFBundleIdentifier")
          executable = info.get("CFBundleExecutable")
          assert bundle_id, "缺少 CFBundleIdentifier"
          assert executable and os.path.isfile(os.path.join(app, executable)), "缺少主可执行文件"
          assert os.path.isfile(os.path.join(app, "Resources/Web/index.html")), "缺少 Resources/Web/index.html"
          print("bundle id:", bundle_id)
          print("executable:", executable)
          print("minimum OS:", info.get("MinimumOSVersion"))
          PY

          shasum -a 256 "build/artifacts/${SCHEME}-unsigned.ipa" | tee build/ipa.sha256
          ls -lh build/artifacts

      - name: 上传未签名 IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: |
            build/artifacts/*.ipa
            build/ipa.sha256
            build/build-device.log
            build/codesign.txt
          if-no-files-found: warn
          retention-days: 14

      - name: 写入构建摘要
        if: always()
        run: |
          {
            echo "## iOS 未签名 IPA"
            echo ""
            if [ -f build/ipa.sha256 ]; then
              echo "- IPA：\`${SCHEME}-unsigned.ipa\`"
              echo "- SHA256：\`$(cut -d' ' -f1 build/ipa.sha256)\`"
            else
              echo "- 未生成 IPA，请查看 \`build-device.log\`"
            fi
            echo "- 安装前需使用第三方工具（Sideloadly、AltStore、ESign 等）自行签名，CI 不提供证书。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 编译模拟器版本（ad-hoc 签名）
        id: simulator-build
        if: inputs.run_simulator_tests
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -project "${PROJECT}" \
            -scheme "${SCHEME}" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "${DERIVED_DATA}" \
            build 2>&1 | tee build/build-simulator.log

      - name: 选择可用 iPhone 模拟器
        id: simulator
        if: steps.simulator-build.outcome == 'success'
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess

          raw = subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "--json"], text=True
          )
          devices = json.loads(raw)["devices"]

          def runtime_key(runtime):
              match = re.search(r"iOS-(\d+)(?:-(\d+))?", runtime)
              if not match:
                  return (0, 0)
              return (int(match.group(1)), int(match.group(2) or 0))

          candidates = [
              (runtime_key(runtime), device["name"], device["udid"])
              for runtime, items in devices.items()
              if "iOS" in runtime
              for device in items
              if device.get("isAvailable") and device.get("name", "").startswith("iPhone")
          ]
          if not candidates:
              raise SystemExit("没有可用的 iPhone 模拟器")

          candidates.sort(reverse=True)
          _, name, udid = candidates[0]
          print(f"选择模拟器: {name} ({udid})")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"udid={udid}\n")
              output.write(f"name={name}\n")
          PY

      - name: 运行 XCTest（非阻塞）
        if: steps.simulator-build.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          rm -rf build/NativeTests.xcresult
          xcodebuild \
            -project "${PROJECT}" \
            -scheme "${SCHEME}" \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "${DERIVED_DATA}" \
            -resultBundlePath build/NativeTests.xcresult \
            test 2>&1 | tee build/test.log

      - name: 上传测试报告
        if: always() && inputs.run_simulator_tests
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-tests
          path: |
            build/*.log
            build/NativeTests.xcresult
          if-no-files-found: warn
          retention-days: 14
